# Per-source (camera/location, or calling-project) analysis policy.
#
# "source" on a POST /v1/analyze request is looked up here by exact match,
# falling back to `default` when there's no entry for it — a camera you
# haven't configured yet just gets conservative defaults instead of a 404.
#
# Local triage and CompreFace face-id are both free (self-hosted, no
# per-call cost) and always run regardless of tier. Tiers only gate the paid
# vision-LLM description step, cheapest to most expensive:
#   skip     - no paid LLM call at all
#   cheap    - one fast/cheap vision-LLM call
#   standard - one capable vision-LLM call
#   thorough - multiple providers cross-checked
#
# `escalate_on` lists which local triage labels (person / animal / vehicle)
# bump a source from its `base_tier` up to `escalate_tier`. Use ["*"] to
# always escalate regardless of what triage finds (e.g. an explicit upload
# from another project, where every image is worth analyzing).
#
# `auto_enroll_unknown_faces` (default false): when CompreFace can't put a
# name to a face, register it as a new placeholder subject instead of just
# reporting "unknown" — so the *next* sighting of that same person matches
# the placeholder instead of being flagged unknown again. Rename the
# placeholder to a real name in CompreFace's own UI once you know who it is;
# this service never renames or merges subjects itself. Leave this off for
# any source with a lot of foot traffic that isn't yours (mail carriers,
# neighbors, solicitors) or you'll fill your face collection with strangers.
#
# `unknown_face_label` (default "Unknown") names that placeholder series:
# subjects come out numbered "<label> 1", "<label> 2", etc., e.g. set it to
# "Amazon Driver" on a front-door source mostly used to tell delivery drivers
# apart — you'll still get the occasional wrong guess for a genuine guest or
# a different courier, same as any auto-enroll false positive; just rename
# that one in CompreFace afterward.

default:
  base_tier: skip
  escalate_tier: standard
  escalate_on: [person]
  max_daily_analyses: 100
  provider_preference: [anthropic, gemini, openai, grok]

sources:
  # Reolink camera watching the yard: deer/rabbits/raccoons wandering through
  # are extremely common and not worth an LLM call; a person shows up rarely
  # enough that even the cheap tier is fine when it happens. No auto-enroll
  # here — a yard cam catches enough random strangers (mail carriers,
  # neighbors, solicitors) that auto-enrolling would fill the face
  # collection with one-off strangers; CompreFace still tries to recognize
  # against your existing subjects either way, just doesn't add new ones.
  front_yard:
    base_tier: skip
    escalate_tier: cheap
    escalate_on: [person]
    max_daily_analyses: 150

  # Same camera as front_yard above, keyed to match whatever your actual
  # HA automation/client sends as `source` — source lookup is an exact,
  # case-sensitive string match, so this needs its own entry rather than
  # falling back to `default`. Keep both in sync, or standardize on one name.
  "Front Yard":
    base_tier: skip
    escalate_tier: cheap
    escalate_on: [person]
    max_daily_analyses: 150

  # Front door: worth describing every visit (packages, guests), and a person
  # at the door always gets the better model. Auto-enroll here (not on
  # front_yard) since a face at the door is worth building recognition for,
  # and it sees far fewer random strangers than a yard-facing camera. Labeled
  # for tracking recurring delivery drivers specifically; rename any that
  # turn out to be a guest or a different courier once you spot them.
  front_door:
    base_tier: cheap
    escalate_tier: standard
    escalate_on: [person]
    max_daily_analyses: 300
    auto_enroll_unknown_faces: true
    unknown_face_label: "Amazon Driver"

  driveway:
    base_tier: skip
    escalate_tier: standard
    escalate_on: [person, vehicle]
    max_daily_analyses: 200

  # Non-camera project (photo/video uploads from memoire) — always worth full
  # analysis regardless of what triage sees, and cross-checked across two
  # providers since there's no "routine deer" case to optimize away here.
  memoire:
    base_tier: thorough
    escalate_tier: thorough
    escalate_on: ["*"]
    max_daily_analyses: 1000
    provider_preference: [anthropic, gemini]
