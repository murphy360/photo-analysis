[project]
name = "photo-analysis"
version = "0.1.0"
description = "Standalone image/video analysis microservice: local object-detection triage, CompreFace face ID, and multi-provider vision-LLM scene description"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "numpy>=2.1",
    "ultralytics>=8.3",
    "opencv-python-headless>=4.10",
    # Listed explicitly (not left as transitive deps of ultralytics) because
    # uv's [tool.uv.sources] index override below only reliably applies to
    # packages that are direct project dependencies.
    "torch",
    "torchvision",
    "anthropic>=0.39",
    "openai>=1.60",
    "google-genai>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ultralytics pulls in torch, which by default resolves PyPI's CUDA-enabled
# build (~3GB of NVIDIA runtime libraries) even though triage only ever runs
# CPU inference on a home server with no GPU. Pinning to PyTorch's CPU-only
# wheel index cuts the image from ~13GB down to a normal size and avoids
# downloading/shipping a CUDA stack that torch.cuda.is_available() would
# report as unusable anyway.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
