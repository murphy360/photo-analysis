[project]
name = "photo-analysis"
version = "0.1.0"
description = "Standalone image/video analysis microservice: local object-detection triage, CompreFace face ID, and multi-provider vision-LLM scene description"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pillow>=11.0",
    "numpy>=2.1",
    "ultralytics>=8.3",
    "opencv-python-headless>=4.10",
    "anthropic>=0.39",
    "openai>=1.60",
    "google-genai>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
