services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./app/config/sources.yaml:/app/app/config/sources.yaml:ro
    restart: unless-stopped

  mcp:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - app
    restart: unless-stopped
